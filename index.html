<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263b5a">
  <meta name="description" content="TODAY+ 個人生活與任務管理">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>TODAY+</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">YOUR DAY, IN ORDER</div>
        <h1>TODAY<span>+</span></h1>
      </div>
      <button class="avatar" aria-label="個人設定">＋</button>
    </header>

    <main>
      <section class="welcome-row">
        <div>
          <p class="muted" id="today-date"></p>
          <h2>今天，從一件事開始。</h2>
        </div>
        <div class="week-chip" id="week-label">本週</div>
      </section>

      <section class="summary-card">
        <div class="summary-copy">
          <span class="card-kicker">TODAY'S PROGRESS</span>
          <strong id="progress-number">0%</strong>
          <span class="summary-detail" id="progress-detail">已完成 0 / 0 項任務</span>
        </div>
        <div class="progress-ring" id="progress-ring" role="img" aria-label="今日完成率 0%">
          <div class="ring-inner"><span id="ring-number">0%</span></div>
        </div>
      </section>

      <section class="section-heading">
        <div>
          <span class="card-kicker">YOUR TASKS</span>
          <h3 id="task-heading">今日待辦</h3>
        </div>
        <button class="text-button" id="show-all">查看全部</button>
      </section>

      <section class="task-list" id="task-list"></section>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">✦</div>
        <strong>今天還沒有安排</strong>
        <p>把想完成的事情加進來吧。</p>
      </div>

      <section class="weekly-card">
        <div class="weekly-top">
          <div>
            <span class="card-kicker">THIS WEEK</span>
            <h3>本週進度</h3>
          </div>
          <span class="weekly-percent" id="week-percent">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="week-bar"></div></div>
        <p class="weekly-note" id="week-note">一步一步完成你的本週目標。</p>
      </section>
    </main>

    <button class="add-button" id="add-task" aria-label="新增任務">＋ <span>新增任務</span></button>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-item active" data-view="today"><span>⌂</span>首頁</button>
      <button class="nav-item" data-view="tasks"><span>☷</span>任務</button>
      <button class="nav-item" data-view="calendar"><span>▦</span>月曆</button>
      <button class="nav-item" data-view="stats"><span>◔</span>統計</button>
    </nav>
  </div>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <div class="dialog-head">
        <div><span class="card-kicker">MAKE IT HAPPEN</span><h2>新增任務</h2></div>
        <button type="button" class="close-button" id="close-dialog">×</button>
      </div>
      <label>任務名稱<input id="task-title" maxlength="80" placeholder="例如：整理房間" required></label>
      <div class="form-grid">
        <label>日期<input id="task-date" type="date" required></label>
        <label>時間<input id="task-time" type="time"></label>
      </div>
      <div class="form-grid">
        <label>分類
          <select id="task-category">
            <option value="生活">生活</option><option value="工作">工作</option>
            <option value="健康">健康</option><option value="購物">購物</option>
            <option value="財務">財務</option><option value="其他">其他</option>
          </select>
        </label>
        <label>優先順序
          <select id="task-priority">
            <option value="中">中</option><option value="高">高</option><option value="低">低</option>
          </select>
        </label>
      </div>
      <label>備註（選填）<textarea id="task-note" rows="2" placeholder="補充說明…"></textarea></label>
      <button class="submit-button" type="submit">儲存任務</button>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
